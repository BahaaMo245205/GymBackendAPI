<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Gym System | تسجيل الدخول</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <!-- زرار البداية -->
    <button class="btn" onclick="startGoogleLogin()">تسجيل الدخول باستخدام جوجل</button>

    <script>
        const API_BASE = "http://127.0.0.1:8000/v1/api/auth";

        // 1. طلب التوجيه من السيرفر
        function startGoogleLogin() {
            window.location.href = `${API_BASE}/loginGoogle`;
        }

        // 2. استقبال التوكن عند العودة (يجب أن تكون هذه الصفحة هي الـ Redirect URI)
        window.onload = function () {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (token) {
                // حفظ التوكن في المتصفح
                localStorage.setItem('access_token', token);
                alert("تم تسجيل الدخول بنجاح! سيتم تحويلك لصفحة البروفايل...");

                // الانتقال لصفحة البروفايل
                window.location.href = "/profile.html";
            }
        };
