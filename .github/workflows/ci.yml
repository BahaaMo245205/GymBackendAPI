name: System Gym

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: systemgym
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: mysql+aiomysql://root:rootpassword@127.0.0.1:3306/systemgym
      TEST_DATABASE_URL: mysql+aiomysql://root:rootpassword@127.0.0.1:3306/systemgym
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: systemgym
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: HS256
      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: test
      MAIL_FROM: test@example.com
      MAIL_PORT: "587"
      MAIL_SERVER: localhost
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pymysql cryptography aiomysql pytest pytest-asyncio httpx

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -prootpassword --silent 2>/dev/null; then
              echo "MySQL ready"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run Tests
        run: python -m pytest App/Test -v

      # ----- Docker (اختياري) -----
      - name: Create .env for Compose
        run: |
          cat > .env << EOF
          DATABASE_URL=mysql+aiomysql://root:rootpassword@172.17.0.1:3306/systemgym
          REDIS_HOST=redis
          REDIS_PORT=6379
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_BACKEND_URL=redis://redis:6379/0
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          STRIPE_SECRET_KEY=${{secrets.STRIPE_SECRET_KEY}}
          STRIPE_WEBHOOK_SECRET=${{secrets.STRIPE_WEBHOOK_SECRET}}
          ALGORITHM=HS256
          MAIL_USERNAME=test@example.com
          MAIL_PASSWORD=test
          MAIL_FROM=test@example.com
          MAIL_SERVER=localhost
          MAIL_PORT=587
          FRONTEND_URL=http://localhost:3000
          EOF

      - name: Docker Compose up
        run: |
          docker compose version
          docker compose up -d --build
          docker compose ps