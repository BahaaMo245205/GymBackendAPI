name: System Gym

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: systemgym
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      # نفس الباسورد في MySQL service
      DATABASE_URL: mysql+aiomysql://root:rootpassword@127.0.0.1:3306/systemgym
      TEST_DATABASE_URL: mysql+aiomysql://root:rootpassword@127.0.0.1:3306/systemgym
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: systemgym

      REDIS_HOST: localhost
      REDIS_PORT: "6379"

      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: HS256

      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: test
      MAIL_FROM: test@example.com
      MAIL_PORT: "587"
      MAIL_SERVER: localhost

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      ADMINID: d1d81cf778e94c6fb0c2b82a7b503e45
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pymysql cryptography aiomysql pytest pytest-asyncio httpx
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -prootpassword --silent 2>/dev/null; then
              echo "MySQL ready"
              exit 0
            fi
            echo "waiting $i"
            sleep 2
          done
          exit 1

      - name: Run Tests
        run: python -m pytest App/Test -v