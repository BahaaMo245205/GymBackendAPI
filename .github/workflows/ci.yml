name: System Gym CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: systemgym
      DATABASE_URL: mysql+pymysql://root:rootpassword@127.0.0.1:3306/systemgym
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      SECRET_KEY: ci-test-secret-key-change-in-prod
      ALGORITHM: HS256
      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: test
      MAIL_FROM: test@example.com
      MAIL_PORT: "587"
      MAIL_SERVER: localhost
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pymysql cryptography

      - name: Setup MySQL
        uses: mirromutth/mysql-action@v1.1
        with:
          mysql version: "8.0"
          mysql database: "systemgym"
          mysql root password: "rootpassword"

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -prootpassword --silent; then
              echo "MySQL ready"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Setup Redis
        uses: zhulik/redis-action@1.1.0
        with:
          redis version: "7"

      - name: Alembic upgrade
        run: python -m alembic -c alembic.ini upgrade head

      - name: Pytest
        run: python -m pytest -q
        env:
          DATABASE_URL: mysql+aiomysql://root:rootpassword@127.0.0.1:3306/systemgym