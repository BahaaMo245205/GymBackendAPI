name: System Gym

on:
  push:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. تشغيل خدمة الـ MySQL سرفر في الخلفية عشان التيستات تشوفها
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: systemgym
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      # Database
      DATABASE_URL: mysql+aiomysql://root:${{ secrets.MYSQL_ROOT_PASSWORD }}@localhost:3306/systemgym
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: systemgym
      MYSQL_USER: root
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

      # Ports
      MYSQL_PUBLISH_PORT: 3306
      API_PORT: 8000

      # Redis
      REDIS_HOST: localhost
      REDIS_PORT: 6379

      # App Secret Key
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

      # Email
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_FROM: bebo245205@gmail.com
      MAIL_PORT: 587
      MAIL_SERVER: smtp.gmail.com

      # OAuth2 (Google)
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_AUTH_ENDPOINT: https://accounts.google.com/o/oauth2/auth
      GOOGLE_TOKEN_ENDPOINT: https://oauth2.googleapis.com/token
      GOOGLE_USERINFO_ENDPOINT: https://www.googleapis.com/oauth2/v2/userinfo

      # User ID
      ADMINID: d1d81cf778e94c6fb0c2b82a7b503e45

      # Stripe
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      FRONTEND_URL: http://localhost:5500/Frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run Migrations and Tests
        run: |
          alembic upgrade head
          
      - name: "setup redis last version"
        uses: zhulik/redis-action@1.1.0
        with:
          redis version: "7"
          number of databases: 100

      - name: Run Tests
        run: python -m pytest
