<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: #f4f7fb; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container {
            background: #fff; width: 100%; max-width: 420px;
            padding: 40px 32px; border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }
        h1 { text-align: center; color: #1e293b; font-size: 22px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 28px; }
        label { display: block; color: #334155; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0;
            border-radius: 10px; font-size: 14px; background: #f8fafc; outline: none; margin-bottom: 18px;
        }
        input:focus { border-color: #3b82f6; background: #fff; }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: #3b82f6; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .back { display: block; text-align: center; margin-top: 18px; color: #3b82f6; text-decoration: none; font-size: 14px; }
        .msg { display: none; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; }
        .msg.ok { display: block; background: #dcfce7; color: #166534; }
        .msg.err { display: block; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>نسيت كلمة المرور؟</h1>
        <p class="subtitle">أدخل بريدك وسنرسل لك رابط إعادة التعيين</p>

        <div id="msg" class="msg"></div>

        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@email.com">

        <button id="btnSend">إرسال الرابط</button>
        <a class="back" href="login.html">العودة لتسجيل الدخول</a>
    </div>

    <script>
        const BACKEND_URL = "http://localhost:8000";
        const btn = document.getElementById("btnSend");
        const msg = document.getElementById("msg");

        function showMsg(text, ok = true) {
            msg.className = "msg " + (ok ? "ok" : "err");
            msg.textContent = text;
        }

        btn.addEventListener("click", async () => {
            const email = document.getElementById("email").value.trim();
            if (!email) {
                showMsg("أدخل البريد الإلكتروني", false);
                return;
            }

            btn.disabled = true;
            btn.textContent = "جاري الإرسال...";

            try {
                const res = await fetch(`${BACKEND_URL}/v1/api/auth/forgot-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ "email":email })
                });
                const data = await res.json();

                if (res.ok) {
                    showMsg(data.message || "تم إرسال الرابط إن وُجد الحساب", true);
                    // للتجربة فقط
                    if (data.debug_reset_link) {
                        console.log("Reset link:", data.debug_reset_link);
                        showMsg(data.message + " (شوف اللينك في Console)", true);
                    }
                } else {
                    const detail = typeof data.detail === "string"
                        ? data.detail
                        : "حدث خطأ";
                    showMsg(detail, false);
                }
            } catch (err) {
                console.error(err);
                showMsg("تعذر الاتصال بالسيرفر", false);
            } finally {
                btn.disabled = false;
                btn.textContent = "إرسال الرابط";
            }
        });
    </script>
</body>
</html>
