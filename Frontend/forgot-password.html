<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - Gym System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #34495e;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <!-- خطوة 1: طلب الإيميل -->
        <div id="forgot-step">
            <h2>نسيت كلمة المرور؟</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">أدخل بريدك الإلكتروني وسنرسل لك تعليمات
                الاستعادة.</p>
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <button onclick="handleForgotPassword()">إرسال الرابط</button>
        </div>

        <!-- خطوة 2: إدخال كلمة المرور الجديدة (تظهر لو الـ URL يحتوي على Token) -->
        <div id="reset-step" class="hidden">
            <h2>تعيين كلمة مرور جديدة</h2>
            <input type="password" id="new-password" placeholder="كلمة المرور الجديدة" required>
            <button onclick="handleResetPassword()">تغيير كلمة المرور</button>
        </div>

        <div id="message" class="message"></div>
        <div style="margin-top: 20px;">
            <a href="index.html" style="color: #2c3e50; text-decoration: none; font-size: 14px;">العودة لتسجيل
                الدخول</a>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/v1/api/auth";

        // فحص هل الصفحة مفتوحة وعليها Token في الـ URL (يعني جاي من رابط الاستعادة)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            document.getElementById('forgot-step').classList.add('hidden');
            document.getElementById('reset-step').classList.remove('hidden');
        }

        // طلب إرسال رابط الاستعادة
        async function handleForgotPassword() {
            const email = document.getElementById('email').value;
            const msgDiv = document.getElementById('message');

            if (!email) {
                msgDiv.style.color = "red";
                msgDiv.innerText = "الرجاء إدخال البريد الإلكتروني.";
                return;
            }

            try {
                const response = await fetch(`${API_URL}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();

                if (response.ok) {
                    msgDiv.style.color = "green";
                    msgDiv.innerText = "تم إرسال تعليمات الاستعادة إلى بريدك الإلكتروني.";
                } else {
                    msgDiv.style.color = "red";
                    msgDiv.innerText = data.detail || "حدث خطأ، حاول مرة أخرى.";
                }
            } catch (e) {
                msgDiv.style.color = "red";
                msgDiv.innerText = "خطأ في الاتصال بالخادم.";
            }
        }

        // تنفيذ تغيير كلمة المرور الجديدة
        async function handleResetPassword() {
            const newPassword = document.getElementById('new-password').value;
            const msgDiv = document.getElementById('message');

            if (!newPassword || newPassword.length < 6) {
                msgDiv.style.color = "red";
                msgDiv.innerText = "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";
                return;
            }

            try {
                const response = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: newPassword })
                });
                const data = await response.json();

                if (response.ok) {
                    msgDiv.style.color = "green";
                    msgDiv.innerText = "تم تغيير كلمة المرور بنجاح! جاري تحويلك لتسجيل الدخول...";
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2000);
                } else {
                    msgDiv.style.color = "red";
                    msgDiv.innerText = data.detail || "الرابط غير صالح أو انتهت صلاحيته.";
                }
            } catch (e) {
                msgDiv.style.color = "red";
                msgDiv.innerText = "خطأ في الاتصال بالخادم.";
            }
        }
    </script>

</body>

</html>
