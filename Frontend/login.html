<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #1e293b;
            background: #f8fafc;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover:not(:disabled) {
            background: #2563eb;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider::before {
            margin-left: 10px;
        }

        .divider::after {
            margin-right: 10px;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #334155;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease;
            margin-top: 0;
        }

        .google-btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .register-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .register-link:hover {
            color: #2563eb;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تسجيل الدخول</h1>
        <p class="subtitle">أدخل بياناتك للدخول إلى حسابك</p>

        <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="example@email.com">
        </div>

        <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button id="loginBtn">دخول</button>

        <div class="divider">أو</div>

        <button type="button" id="googleLoginBtn" class="google-btn">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.17 21.32 7.23 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.18C.43 8.13 0 9.83 0 12s.43 3.87 1.18 5.39l4.09-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.18 6.61l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            التسجيل بواسطة Google
        </button>

        <a href="regester.html" class="register-link">ليس لديك حساب؟ سجل الآن</a>
    </div>

    <script>
        const BACKEND_URL = "http://localhost:8000";

        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const btnLogin = document.getElementById("loginBtn");
        const googleLoginBtn = document.getElementById("googleLoginBtn");

        // لو المستخدم مسجل دخول بالفعل → روح للرئيسية
        (async function checkExistingSession() {
            const token = localStorage.getItem("access_token");
            if (!token) return;

            try {
                const res = await fetch(`${BACKEND_URL}/v1/api/auth/check`, {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (res.ok) {
                    window.location.href = "index.html";
                } else {
                    localStorage.clear();
                }
            } catch (err) {
                // لو السيرفر مش شغال، نسيب المستخدم في صفحة اللوجين
                console.error(err);
            }
        })();

        async function handleLogin() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                alert("الرجاء إدخال جميع البيانات المطلوبة!");
                return;
            }

            try {
                btnLogin.disabled = true;
                btnLogin.textContent = "جاري الدخول...";

                const response = await fetch(`${BACKEND_URL}/v1/api/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem("access_token", result.access_token);

                    if (result.refresh_token) {
                        localStorage.setItem("refresh_token", result.refresh_token);
                    }
                    if (result.user) {
                        localStorage.setItem("user", JSON.stringify(result.user));
                    }

                    window.location.href = "index.html";
                } else {
                    alert("فشل تسجيل الدخول: " + (result.detail || "البيانات غير صحيحة"));
                }
            } catch (error) {
                console.error("Connection Error:", error);
                alert("تعذر الاتصال بالسيرفر، تأكد من تشغيل الباك إند!");
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = "دخول";
            }
        }

        btnLogin.addEventListener("click", handleLogin);

        passwordInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleLogin();
        });

        emailInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleLogin();
        });

        googleLoginBtn.addEventListener("click", () => {
            window.location.href = `${BACKEND_URL}/v1/api/auth/loginGoogle`;
        });
    </script>
</body>
</html>
