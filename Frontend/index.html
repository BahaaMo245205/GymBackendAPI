<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول وإنشاء الحساب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 380px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .google-btn {
            background-color: #ffffff;
            color: #444;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
        }

        .google-btn:hover {
            background-color: #f8f9fa;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #888;
            font-size: 13px;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: #ddd;
        }

        .divider::before {
            right: 0;
        }

        .divider::after {
            left: 0;
        }

        .extra-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 13px;
        }

        .link {
            color: #007BFF;
            cursor: pointer;
        }

        .link:hover {
            text-decoration: underline;
        }

        .switch-link {
            text-align: center;
            margin-top: 15px;
            color: #007BFF;
            cursor: pointer;
            font-size: 14px;
        }

        .switch-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        #message {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- فورم تسجيل الدخول -->
        <div id="login-form">
            <h2>تسجيل الدخول</h2>
            <div class="form-group">
                <label>البريد الإلكتروني / اسم المستخدم</label>
                <input type="text" id="login-username" placeholder="أدخل البريد أو اسم المستخدم">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="login-password" placeholder="أدخل كلمة المرور">
            </div>

            <div class="extra-links">
                <span class="link" onclick="handleForgotPassword()">هل نسيت كلمة المرور؟</span>
            </div>

            <button onclick="handleLogin()">دخول</button>

            <div class="divider">أو</div>

            <button class="google-btn" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" />
                    <path fill="#34A853"
                        d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.36 7.23 24 12 24z" />
                    <path fill="#FBBC05"
                        d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.13 0 9.84 0 12s.43 3.87 1.18 5.38l4.09-3.14z" />
                    <path fill="#EA4335"
                        d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.64 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z" />
                </svg>
                التسجيل باستخدام Google
            </button>

            <div class="switch-link" onclick="toggleForms()">ليس لديك حساب؟ سجل الان</div>
        </div>

        <!-- فورم إنشاء حساب جديد -->
        <div id="signup-form" class="hidden">
            <h2>حساب جديد</h2>
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="signup-username" placeholder="اختر اسم مستخدم">
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="signup-email" placeholder="أدخل بريدك الإلكتروني">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="signup-password" placeholder="أدخل كلمة مرور قوية">
            </div>
            <div class="form-group">
                <label>تأكيد كلمة المرور</label>
                <input type="password" id="signup-confirm-password" placeholder="أعد إدخال كلمة المرور">
            </div>

            <button onclick="handleSignup()">إنشاء الحساب</button>
            <div class="switch-link" onclick="toggleForms()">لديك حساب بالفعل؟ سجل دخولك</div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/v1/api/auth";

        function toggleForms() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            loginForm.classList.toggle('hidden');
            signupForm.classList.toggle('hidden');
            document.getElementById('message').innerText = '';
        }

        async function handleLogin() {
            const email = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const msgDiv = document.getElementById('message');

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    msgDiv.style.color = 'green';
                    msgDiv.innerText = 'تم تسجيل الدخول بنجاح!';

                    // حفظ التوكنز بالشكل الصحيح لتدعم لوحة التحكم
                    localStorage.setItem('access_token', data.access_token || data.token);
                    if (data.refresh_token || data['refresh-token']) {
                        localStorage.setItem('refresh-token', data.refresh_token || data['refresh-token']);
                    }

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                } else {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = data.detail || 'فشل تسجيل الدخول!';
                }
            } catch (error) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = 'حدث خطأ في الاتصال بالخادم.';
            }
        }

        async function handleSignup() {
            const username = document.getElementById('signup-username').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;
            const msgDiv = document.getElementById('message');

            if (password !== confirmPassword) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = 'كلمتا المرور غير متطابقتين!';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, email: email, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    msgDiv.style.color = 'green';
                    msgDiv.innerText = 'تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.';
                    setTimeout(toggleForms, 2000);
                } else {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = data.detail || 'فشل إنشاء الحساب!';
                }
            } catch (error) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = 'حدث خطأ في الاتصال بالخادم.';
            }
        }

        // توجيه المستخدم لصفحة تسجيل الدخول بجوجل
        function handleGoogleLogin() {
            window.location.href = `${API_URL}/google/login`; // عدلها حسب مسار جوجل عندك (مثل loginGoogle أو google/login)
        }

        // التوجيه لصفحة استعادة كلمة المرور
        function handleForgotPassword() {
            const email = document.getElementById('login-username').value;
            if (email && email.includes('@')) {
                window.location.href = `forgot-password.html?email=${encodeURIComponent(email)}`;
            } else {
                window.location.href = 'forgot-password.html';
            }
        }
    </script>

</body>

</html>
