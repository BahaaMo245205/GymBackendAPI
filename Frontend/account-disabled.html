<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحساب معطل - نظام الجيم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
        }
        h1 {
            color: #1e293b;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        a {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin: 4px;
        }
        .btn-primary {
            background: #3b82f6;
            color: #fff;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✕</div>
        <h1>تم تعطيل حسابك</h1>
        <p>
            حسابك غير مفعّل حاليًا من قِبل الإدارة.
            لا يمكنك استخدام النظام إلى أن يتم تفعيل الحساب مرة أخرى.
            <br><br>
            تواصل مع الدعم أو إدارة الجيم للمساعدة.
        </p>
        <a class="btn-primary" href="login.html">العودة لتسجيل الدخول</a>
        <a class="btn-secondary" href="mailto:gym-support@bahaadevs.com">تواصل مع الدعم</a>
    </div>
</body>
</html>
